<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Circular clip -->
  <defs>
    <clipPath id="circle-clip">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#0a1510"/>

  <!-- Outer gold ring -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.85"/>

  <!-- Inner ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#c9a84c" stroke-width="0.35" opacity="0.4"/>

  <!-- Corner ornament dots -->
  <circle cx="16" cy="2.2" r="0.9" fill="#c9a84c" opacity="0.85"/>
  <circle cx="29.8" cy="16" r="0.9" fill="#c9a84c" opacity="0.85"/>
  <circle cx="16" cy="29.8" r="0.9" fill="#c9a84c" opacity="0.85"/>
  <circle cx="2.2" cy="16" r="0.9" fill="#c9a84c" opacity="0.85"/>

  <!-- Letter К large -->
  <text
    x="16"
    y="23"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="21"
    font-style="italic"
    font-weight="400"
    fill="#c9a84c"
  >К</text>
</svg>
