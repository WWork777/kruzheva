<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#0a1510"/>

  <!-- Outer gold border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="3" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.7"/>

  <!-- Inner decorative border -->
  <rect x="3.5" y="3.5" width="25" height="25" rx="2" fill="none" stroke="#c9a84c" stroke-width="0.4" opacity="0.35"/>

  <!-- Corner ornaments -->
  <circle cx="5" cy="5" r="1" fill="#c9a84c" opacity="0.6"/>
  <circle cx="27" cy="5" r="1" fill="#c9a84c" opacity="0.6"/>
  <circle cx="5" cy="27" r="1" fill="#c9a84c" opacity="0.6"/>
  <circle cx="27" cy="27" r="1" fill="#c9a84c" opacity="0.6"/>

  <!-- Letter К italic serif -->
  <text
    x="16"
    y="22"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-style="italic"
    font-weight="400"
    fill="#c9a84c"
    letter-spacing="-0.5"
  >К</text>
</svg>
